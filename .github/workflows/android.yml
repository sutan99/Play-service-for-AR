name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Mengaktifkan tombol menu "Run workflow" manual

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # Membuat berkas rilis dan mengompres ukuran APK menjadi kecil
    - name: Build Release APK
      run: ./gradlew assembleRelease

    # Proses Menandatangani APK menggunakan data rahasia dari GitHub Secrets
    - name: Sign APK
      uses: r0adkll/sign-android-release@v1
      id: sign_app
      with:
        releaseDirectory: app/build/outputs/apk/release
        signingKeyBase64: ${{ secrets.SIGNING_KEY }}
        alias: ${{ secrets.ALIAS }}
        keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}

    # Mengunggah hasil APK rilis yang berukuran kecil dan siap instal
    - name: Upload Signed APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: APK-Rilis-Kecil
        path: ${{ steps.sign_app.outputs.signedReleaseFile }}
        
